<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace}
.game-container{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.board-wrapper{background:#16213e;padding:10px;border-radius:8px;box-shadow:0 0 30px rgba(0,0,0,0.5)}
canvas#board{display:block;background:#0f0f23;border:1px solid #2a2a5e;border-radius:2px}
.side-panel{display:flex;flex-direction:column;gap:12px;min-width:130px}
.info-box{background:#16213e;padding:12px 16px;border-radius:8px;color:#e0e0e0;box-shadow:0 0 20px rgba(0,0,0,0.3)}
.info-box h3{font-size:11px;color:#666;margin-bottom:4px;letter-spacing:2px}
.info-box .value{font-size:20px;font-weight:bold;color:#00ff88}
canvas#next{display:block;background:#0f0f23;border-radius:4px;margin-top:4px}
.controls{background:#16213e;padding:12px 16px;border-radius:8px;color:#888;font-size:11px;line-height:1.6}
.controls kbd{background:#0f0f23;color:#00ff88;padding:2px 6px;border-radius:3px;font-size:10px}
#game-over{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:100;justify-content:center;align-items:center;flex-direction:column}
#game-over.show{display:flex}
#game-over h2{color:#ff4757;font-size:32px;margin-bottom:10px}
#game-over p{color:#ccc;font-size:16px;margin-bottom:20px}
#game-over button{background:#00ff88;color:#0f0f23;border:none;padding:10px 30px;font-size:18px;border-radius:8px;cursor:pointer;font-weight:bold}
#game-over button:hover{background:#00cc6a}
</style>
</head>
<body>
<div class="game-container">
  <div class="board-wrapper">
    <canvas id="board" width="240" height="480"></canvas>
  </div>
  <div class="side-panel">
    <div class="info-box"><h3>SCORE</h3><div class="value" id="score">0</div></div>
    <div class="info-box"><h3>LINES</h3><div class="value" id="lines">0</div></div>
    <div class="info-box"><h3>LEVEL</h3><div class="value" id="level">1</div></div>
    <div class="info-box"><h3>NEXT</h3><canvas id="next" width="120" height="120"></canvas></div>
    <div class="controls">
      <kbd>←</kbd><kbd>→</kbd> 이동 &nbsp; <kbd>↑</kbd> 회전<br>
      <kbd>↓</kbd> 소프트 드롭 &nbsp; <kbd>Space</kbd> 하드 드롭<br>
      <kbd>R</kbd> 다시 시작
    </div>
  </div>
</div>
<div id="game-over">
  <h2>GAME OVER</h2>
  <p>Score: <span id="final-score">0</span></p>
  <button onclick="restart()">다시 하기</button>
</div>
<script>
const COLS=10,ROWS=20,BLOCK=24;
const board=document.getElementById('board');
const ctx=board.getContext('2d');
const nextCanvas=document.getElementById('next');
const nctx=nextCanvas.getContext('2d');

const SHAPES=[
  {shape:[[1,1,1,1]],color:'#00f0f0'},    // I
  {shape:[[1,1],[1,1]],color:'#f0f000'},  // O
  {shape:[[0,1,0],[1,1,1]],color:'#a000f0'},// T
  {shape:[[0,1,1],[1,1,0]],color:'#00f000'},// S
  {shape:[[1,1,0],[0,1,1]],color:'#f00000'},// Z
  {shape:[[1,0,0],[1,1,1]],color:'#f0a000'},// J
  {shape:[[0,0,1],[1,1,1]],color:'#0000f0'} // L
];

let grid,current,nextPiece,score,lines,level,gameOver,dropInterval,dropTimer,lastTime;

function createGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(0))}

function newPiece(idx){
  const s=idx!==undefined?SHAPES[idx]:SHAPES[Math.floor(Math.random()*SHAPES.length)];
  return{shape:s.shape.map(r=>[...r]),color:s.color,x:Math.floor((COLS-s.shape[0].length)/2),y:0,rotate:()=>{
    const newShape=current.shape[0].map((_,i)=>current.shape.map(r=>r[i]).reverse());
    const old=current.shape;
    current.shape=newShape;
    if(collides(current.x,current.y))current.shape=old;
  }};
}

function collides(x,y,shape){
  shape=shape||current.shape;
  for(let r=0;r<shape.length;r++)
    for(let c=0;c<shape[r].length;c++)
      if(shape[r][c]&&(y+r>=ROWS||x+c<0||x+c>=COLS||y+r<0||grid[y+r]?.[x+c]))return true;
  return false;
}

function lock(){
  for(let r=0;r<current.shape.length;r++)
    for(let c=0;c<current.shape[r].length;c++)
      if(current.shape[r][c])grid[current.y+r][current.x+c]=current.color;
  clearLines();
  spawn();
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(grid[r].every(Boolean)){
      grid.splice(r,1);
      grid.unshift(Array(COLS).fill(0));
      cleared++;
      r++;
    }
  }
  if(cleared){
    const pts=[0,100,300,500,800];
    score+=pts[Math.min(cleared,4)]*level;
    lines+=cleared;
    level=Math.floor(lines/10)+1;
    dropInterval=Math.max(50,1000-(level-1)*80);
    document.getElementById('score').textContent=score;
    document.getElementById('lines').textContent=lines;
    document.getElementById('level').textContent=level;
  }
}

function spawn(){
  current={shape:nextPiece.shape.map(r=>[...r]),color:nextPiece.color,
    x:Math.floor((COLS-nextPiece.shape[0].length)/2),y:0,
    rotate:function(){const ns=this.shape[0].map((_,i)=>this.shape.map(r=>r[i]).reverse());const old=this.shape;this.shape=ns;if(collides(this.x,this.y))this.shape=old}};
  nextPiece=newPiece();
  drawNext();
  if(collides(current.x,current.y)){gameOver=true;document.getElementById('final-score').textContent=score;document.getElementById('game-over').classList.add('show')}
}

function move(dx){
  if(!collides(current.x+dx,current.y)){current.x+=dx;return true}
  return false
}

function drop(){
  if(!collides(current.x,current.y+1)){current.y++;return true}
  lock();return false
}

function hardDrop(){while(drop());}

function drawGrid(){
  ctx.fillStyle='#0f0f23';ctx.fillRect(0,0,240,480);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]){ctx.fillStyle=grid[r][c];ctx.fillRect(c*BLOCK,r*BLOCK,BLOCK-1,BLOCK-1);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(c*BLOCK+2,r*BLOCK+2,BLOCK-5,BLOCK-5)}
  }
  if(current&&!gameOver){
    for(let r=0;r<current.shape.length;r++)for(let c=0;c<current.shape[r].length;c++){
      if(current.shape[r][c]){ctx.fillStyle=current.color;ctx.fillRect((current.x+c)*BLOCK,(current.y+r)*BLOCK,BLOCK-1,BLOCK-1);ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect((current.x+c)*BLOCK+2,(current.y+r)*BLOCK+2,BLOCK-5,BLOCK-5)}
    }
  }
  ctx.strokeStyle='#1a1a3e';ctx.lineWidth=0.5;
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*BLOCK);ctx.lineTo(240,r*BLOCK);ctx.stroke()}
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*BLOCK,0);ctx.lineTo(c*BLOCK,480);ctx.stroke()}
}

function drawNext(){
  nctx.fillStyle='#0f0f23';nctx.fillRect(0,0,120,120);
  if(!nextPiece)return;
  const s=nextPiece.shape,sz=24;
  const ox=(120-s[0].length*sz)/2,oy=(120-s.length*sz)/2;
  for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++){
    if(s[r][c]){nctx.fillStyle=nextPiece.color;nctx.fillRect(ox+c*sz,oy+r*sz,sz-1,sz-1);nctx.fillStyle='rgba(255,255,255,0.15)';nctx.fillRect(ox+c*sz+2,oy+r*sz+2,sz-5,sz-5)}
  }
}

function restart(){
  document.getElementById('game-over').classList.remove('show');
  startGame();
}

function startGame(){
  grid=createGrid();score=0;lines=0;level=1;dropInterval=1000;gameOver=false;dropTimer=0;lastTime=0;
  document.getElementById('score').textContent='0';document.getElementById('lines').textContent='0';document.getElementById('level').textContent='1';
  nextPiece=newPiece();spawn();
}

document.addEventListener('keydown',e=>{
  if(gameOver&&e.key.toLowerCase()==='r'){restart();return}
  if(gameOver)return;
  if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='ArrowRight')move(1);
  else if(e.key==='ArrowUp'){current.rotate();if(collides(current.x,current.y)){current.rotate();current.rotate();current.rotate()}}
  else if(e.key==='ArrowDown')drop();
  else if(e.key===' ')e.preventDefault(),hardDrop();
  else if(e.key.toLowerCase()==='r')restart();
});

function gameLoop(time=0){
  const dt=time-lastTime;lastTime=time;
  if(!gameOver){
    dropTimer+=dt;
    if(dropTimer>=dropInterval){drop();dropTimer=0}
    drawGrid();
  }
  requestAnimationFrame(gameLoop);
}

startGame();gameLoop();
</script>
</body>
</html>
