<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
  }
  .game-container {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .board-wrapper {
    background: #16213e;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
  }
  canvas#board {
    display: block;
    background: #0f0f23;
  }
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .info-box {
    background: #16213e;
    padding: 15px;
    border-radius: 8px;
    color: #e0e0e0;
    min-width: 120px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
  }
  .info-box h3 {
    font-size: 12px;
    color: #666;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .info-box .value {
    font-size: 22px;
    font-weight: bold;
    color: #00ff88;
  }
  .info-box canvas#next {
    display: block;
    background: #0f0f23;
    border-radius: 4px;
  }

  /* ─── 도우미 캐릭터 ─────────────────────────────── */
  .helper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 18px 20px 20px;
    background: #16213e;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
  }
  .pixel-char {
    width: 20px;
    height: 20px;
    background: #00ff88;
    border-radius: 3px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.3));
    box-shadow:
      /* 1행:   ■■■   */
      32px 0 #00ff88, 64px 0 #00ff88, 96px 0 #00ff88,
      /* 2행:  ■   ■  */
      0px 32px #00ff88, 128px 32px #00ff88,
      /* 3행:  ■ ■ ■  (눈) */
      0px 64px #00ff88, 64px 64px #00ff88, 128px 64px #00ff88,
      /* 4행:  ■   ■  */
      0px 96px #00ff88, 128px 96px #00ff88,
      /* 5행:   ■■■   */
      32px 128px #00ff88, 64px 128px #00ff88, 96px 128px #00ff88;
  }
  /* ─── 말풍선 ───────────────────────────────────── */
  .speech-bubble {
    position: relative;
    background: #0f0f23;
    color: #00ff88;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 12px;
    border: 1px solid #00ff88;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 7px solid #0f0f23;
  }
  .speech-bubble::before {
    content: '';
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 8px solid #00ff88;
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="board-wrapper">
    <canvas id="board" width="240" height="480"></canvas>
  </div>
  <div class="side-panel">
    <div class="info-box">
      <h3>SCORE</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="info-box">
      <h3>LINES</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="info-box">
      <h3>LEVEL</h3>
      <div class="value" id="level">0</div>
    </div>
    <div class="info-box">
      <h3>NEXT</h3>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="helper">
      <div class="pixel-char"></div>
      <div class="speech-bubble">Ready!</div>
    </div>
  </div>
</div>
<script>
const COLS = 10;
const ROWS = 20;
const BLOCK = 24; // px

const board = document.getElementById('board');
const ctx = board.getContext('2d');

// 빈 그리드 렌더링
function render() {
  ctx.fillStyle = '#0f0f23';
  ctx.fillRect(0, 0, 240, 480);

  ctx.strokeStyle = '#1a1a3e';
  ctx.lineWidth = 0.5;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK);
    ctx.lineTo(240, r * BLOCK);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK, 0);
    ctx.lineTo(c * BLOCK, 480);
    ctx.stroke();
  }
}

render();
</script>
</body>
</html>
