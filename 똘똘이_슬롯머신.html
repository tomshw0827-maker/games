<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8" />
 <title>똘똘이 슬롯머신</title>
 <style>
 body {
 font-family: sans-serif;
 background: #ffe8a3;
 text-align: center;
 padding: 40px;
 }

 h1 {
 font-size: 36px;
 }

 .machine {
 background: #ff5c5c;
 border: 6px solid #222;
 border-radius: 24px;
 width: 360px;
 margin: 0 auto;
 padding: 24px;
 box-shadow: 0 8px 0 #222;
 }

 .slots {
 display: flex;
 justify-content: center;
 gap: 12px;
 margin: 24px 0;
 }

 .slot {
 width: 90px;
 height: 90px;
 background: white;
 border: 4px solid #222;
 border-radius: 16px;
 font-size: 48px;
 display: flex;
 align-items: center;
 justify-content: center;
 }

 button {
 font-size: 22px;
 padding: 12px 28px;
 border: 4px solid #222;
 border-radius: 14px;
 background: #ffd93d;
 cursor: pointer;
 box-shadow: 0 5px 0 #222;
 }

 button:active {
 transform: translateY(4px);
 box-shadow: 0 1px 0 #222;
 }

 .score {
 font-size: 22px;
 margin-top: 20px;
 }

 .message {
 font-size: 20px;
 margin-top: 18px;
 font-weight: bold;
 }
 </style>
</head>
<body>

 <h1>🎰 똘똘이 슬롯머신</h1>

 <div class="machine">
 <div class="slots">
 <div class="slot" id="slot1">🧢</div>
 <div class="slot" id="slot2">🍗</div>
 <div class="slot" id="slot3">🎮</div>
 </div>

 <button onclick="spin()">돌려!</button>

 <div class="score">
 아이스크림 포인트: <span id="points">100</span>
 </div>

 <div class="message" id="message">
 야야야! 한 번 돌려봐!
 </div>
 </div>

 <script>
 const items = ["🧢", "🍗", "🎮", "🍦", "🩹", "🪨", "🏹"];
 let points = 100;

 function randomItem() {
 return items[Math.floor(Math.random() * items.length)];
 }

 function spin() {
 if (points < 10) {
 document.getElementById("message").textContent =
 "에이~ 포인트가 없잖아!";
 return;
 }

 points -= 10;

 const slot1 = randomItem();
 const slot2 = randomItem();
 const slot3 = randomItem();

 document.getElementById("slot1").textContent = slot1;
 document.getElementById("slot2").textContent = slot2;
 document.getElementById("slot3").textContent = slot3;

 let message = "";

 if (slot1 === slot2 && slot2 === slot3) {
 points += 80;
 message = "대박! 내가 한 번 해냈지!";
 } else if (slot1 === slot2 || slot2 === slot3 || slot1 === slot3) {
 points += 25;
 message = "오! 두 개 맞았다!";
 } else {
 message = "졌다... 근데 이것도 내 실력이야!";
 }

 document.getElementById("points").textContent = points;
 document.getElementById("message").textContent = message;
 }
 </script>

</body>
</html>
